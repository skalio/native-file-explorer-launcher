name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push makes the running checks for the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version pubspec.yaml allows, and the current one.
        flutter: ["3.41.0", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true
      # Pigeon only generates code and needs a newer Flutter than the
      # plugin itself, so the oldest-Flutter run goes without it.
      - name: Drop pigeon
        if: matrix.flutter != 'stable'
        run: sed -i '/^  pigeon:/d' pubspec.yaml
      - run: flutter pub get --no-example
      - run: flutter analyze lib test
      - run: flutter test --coverage
      - name: Generated code matches pigeons/messages.dart
        if: matrix.flutter == 'stable'
        run: |
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code
      - name: Formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib integration_test
      - run: flutter build macos --debug
      - name: Native tests
        run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' -quiet
      - name: Integration tests
        run: flutter test integration_test -d macos

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --debug
      - name: Native tests
        run: build\windows\x64\plugins\native_file_explorer_launcher\Debug\native_file_explorer_launcher_test.exe
      - name: Integration tests
        run: flutter test integration_test -d windows
