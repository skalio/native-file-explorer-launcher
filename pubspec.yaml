name: native_file_explorer_launcher
description: Show files in Finder or File Explorer, open them, and list the apps that can open them, with icons. For macOS and Windows.
version: 2.0.0
repository: https://github.com/skalio/native-file-explorer-launcher
issue_tracker: https://github.com/skalio/native-file-explorer-launcher/issues
topics:
  - files
  - finder
  - explorer
  - desktop

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: 30.0.2

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: NativeFileExplorerLauncherPlugin
      windows:
        pluginClass: NativeFileExplorerLauncherPluginCApi
